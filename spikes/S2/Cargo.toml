# Spike S2 — Multi-Device-Ratchet-Sync.
#
# SPIKE-CODE. Gehoert NICHT in core/ oder app/ und wird nicht ausgeliefert.
# Eigener Workspace, damit der Produktions-Workspace unter core/ unberuehrt
# bleibt (keine gemeinsame Cargo.lock, keine gemeinsamen Lints).
[workspace]

[package]
name = "vault-s2-sim"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Ratchet-Primitive — echt, nach spec/protokoll-spec.md §1 / ADR-05
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
blake3 = "1"
zeroize = "1"
subtle = "2"
rand_core = "0.6"

# Simulation
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
