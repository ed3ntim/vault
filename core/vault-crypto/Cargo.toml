[package]
name = "vault-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Ausschliesslich etablierte Bibliotheken (ADR-05, CLAUDE.md: keine eigenen
# Kryptoprimitive). Jede Zeile ist einem Verfahren aus
# spec/protokoll-spec.md §1 zugeordnet. Default-Features sind abgeschaltet,
# damit keine I/O-, Netz- oder Thread-Pool-Abhaengigkeit hereinkommt —
# Gate G-5 prueft das.
[dependencies]
# HKDF-SHA-256 (§1)
hkdf = { version = "0.12.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
# KDF_CK des Double Ratchet (§1, §8)
hmac = { version = "0.12.1", default-features = false }
# H(x) = BLAKE3-256 (§1)
blake3 = { version = "1.8.5", default-features = false }
# AEAD: XChaCha20-Poly1305 (§1)
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# Ed25519: Signatur / Onion-Service-Identitaet (§1)
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
# X25519: ECDH (§1, §2)
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
# Schluesselmaterial loeschen bzw. konstantzeitig vergleichen
# (spec/engineering-setup.md §3.1)
zeroize = { version = "1.9.0", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2.6.1", default-features = false }
